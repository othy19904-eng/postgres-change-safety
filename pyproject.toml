[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "postgres-change-safety"
version = "0.10.0"
description = "Evidence-driven PostgreSQL change verification with causal isolation and explicit decision coverage."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "PostgreSQL Change Safety contributors"}]
keywords = [
  "postgresql",
  "pg_stat_statements",
  "performance-regression",
  "major-upgrade",
  "query-plan",
  "verification",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/othy19904-eng/postgres-change-safety"
Repository = "https://github.com/othy19904-eng/postgres-change-safety"
Issues = "https://github.com/othy19904-eng/postgres-change-safety/issues"
Changelog = "https://github.com/othy19904-eng/postgres-change-safety/releases"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
pgchangesafe = "pgchangesafety.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
