name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: pip install -e .
      - run: pytest -q
      - run: pgchangesafe assess examples/major-upgrade.json
      - name: Synthetic blind regression benchmark
        if: matrix.python-version == '3.12'
        run: pgchangesafe benchmark benchmarks/blind_cases.json --strict

  real-postgres-benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3]
    services:
      pg14:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: benchmark
        ports:
          - 5414:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d benchmark"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      pg17:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: benchmark
        ports:
          - 5417:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d benchmark"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[postgres]"
      - name: Generate real PostgreSQL blind suite
        run: |
          python benchmarks/real_pg/generate_suite.py \
            --pg14 "postgresql://postgres:postgres@127.0.0.1:5414/benchmark" \
            --pg17 "postgresql://postgres:postgres@127.0.0.1:5417/benchmark" \
            --trial "${{ matrix.trial }}" \
            --output /tmp/real-postgres-suite.json
      - name: Real PostgreSQL blind benchmark
        run: pgchangesafe benchmark /tmp/real-postgres-suite.json --strict
