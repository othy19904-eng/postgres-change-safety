name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: pip install -e .
      - run: pytest -q
      - run: pgchangesafe assess examples/major-upgrade.json
      - name: Blind regression benchmark
        if: matrix.python-version == '3.12'
        run: pgchangesafe benchmark benchmarks/blind_cases.json --strict
