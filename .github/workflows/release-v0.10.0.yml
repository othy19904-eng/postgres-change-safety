name: publish-v0.10.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v0.10.0.yml"
      - "RELEASE_NOTES_v0.10.0.md"
      - "README.md"
      - "pyproject.toml"
      - "src/pgchangesafety/**"
      - "tests/test_demo.py"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and smoke-test package
        run: |
          python -m pip install --upgrade pip build pytest
          python -m pip install -e .
          pytest -q
          pgchangesafe demo
          python -m build

      - name: Publish v0.10.0 if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.10.0 >/dev/null 2>&1; then
            echo "v0.10.0 already exists; nothing to publish."
            exit 0
          fi

          gh release create v0.10.0 dist/*             --target "$GITHUB_SHA"             --title "PostgreSQL Change Safety v0.10.0"             --notes-file RELEASE_NOTES_v0.10.0.md
